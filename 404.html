<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — Du Quang Vu</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        :root { --bg:#f7f8fa; --text:#0f172a; --muted:#64748b; --accent:#1d4ed8; --on:#fff; color-scheme: light; }
        @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --text:#e6e9ef; --muted:#8590a3; --accent:#7aa2ff; --on:#0b0f17; color-scheme: dark; } }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text); font:400 16px/1.6 Inter, system-ui, sans-serif; text-align:center; }
        .code { font:500 14px ui-monospace, monospace; color:var(--accent); letter-spacing:.08em; }
        h1 { margin:8px 0 12px; font-size:32px; letter-spacing:-.02em; }
        p { margin:0 0 24px; color:var(--muted); }
        a { display:inline-block; padding:10px 18px; border-radius:8px; background:var(--accent); color:var(--on); font-weight:600; text-decoration:none; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a href="/">Back to home</a>
    </main>
</body>
</html>
